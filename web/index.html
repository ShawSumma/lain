<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lain</title>
<style>
:root {
  --bg: #fbfbfa;
  --text: #1f1f1d;
  --dim: #85857f;
  --faint: #b9b9b2;
  --line: #e6e6e1;
  --hover: #f1f1ee;
  --run: #2b6fd6;
  --bad: #c2412f;
  --code: #f4f4f1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161716;
    --text: #e2e2dd;
    --dim: #8e8e88;
    --faint: #5a5b57;
    --line: #2a2b29;
    --hover: #1f201f;
    --run: #6ea3ff;
    --bad: #ef7663;
    --code: #1c1d1c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 18px 22px 24px; }
.mono, pre, .attrs { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
header { display: flex; gap: 14px; align-items: baseline; margin-bottom: 14px; }
header .name { font-weight: 600; }
header .what { color: var(--dim); }
.node { margin: 0; }
.row { display: flex; gap: 10px; align-items: baseline; padding: 1px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--hover); }
.turn { flex: none; width: 10px; color: var(--faint); font-size: 10px; }
.kind { flex: none; width: 58px; color: var(--dim); font-size: 12px; }
.label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.facts { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.when { flex: none; color: var(--faint); font-size: 12px; margin-left: auto; }
.running .took { color: var(--run); }
.failed .label, .failed .took { color: var(--bad); }
.lost .label { color: var(--dim); text-decoration: line-through; }
.body { margin: 2px 0 6px 11px; padding-left: 12px; border-left: 1px solid var(--line); }
.body[hidden] { display: none; }
.attrs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1px 14px; margin: 4px 0 8px; color: var(--dim); }
.attrs[hidden] { display: none; }
.attrs .value { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16em; overflow: auto; }
.said { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 6px; max-width: 980px; }
.said.thinking { color: var(--dim); font-style: italic; }
.said.input, .said.output { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code); padding: 6px 8px; border-radius: 4px; }
.said.output { color: var(--dim); max-height: 22em; overflow: auto; }
.said.note { color: var(--dim); font-size: 13px; }
.live::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: text-bottom; background: var(--run); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.more { color: var(--dim); cursor: pointer; padding: 2px 6px; font-size: 13px; }
.more:hover { color: var(--text); }
.empty { color: var(--dim); }
</style>
</head>
<body>
<header><span class="name">lain</span><span id="what" class="what"></span></header>
<div id="older" class="more" hidden>older</div>
<div id="tree"></div>
<script src="/lain.js"></script>
</body>
</html>
